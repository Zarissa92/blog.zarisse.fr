# zarisse-cadence : bannit les aspirateurs de site, quel que soit leur user-agent.
#
# Ne compte que les requêtes de PAGES : le site est généré par Zensical, donc une
# page se termine par « / » (URL de répertoire) ou par « .html ». Les ressources
# statiques (CSS, JS, images, polices, images de partage) ne comptent pas : un
# visiteur humain en charge beaucoup d'un coup, un aspirateur se trahit sur le
# nombre de pages, pas sur le nombre de fichiers.
#
# Sont ignorés : le flux RSS, les moteurs de recherche et les robots d'aperçu du
# fédivers (voir ignoreregex).

[INCLUDES]
before = common.conf

[Definition]

failregex = ^<HOST> -[^"]*"(?:GET|HEAD|POST) /(?:[^"\s]*(?:/|\.html))?(?:\?[^"\s]*)? HTTP/[0-9.]+" [0-9]{3}

ignoreregex = ^<HOST> -[^"]*"(?:GET|HEAD) /(?:feed_[^" ]*|rss\.xsl|robots\.txt|sitemap[^" ]*)
              ^<HOST> -[^"]*"[^"]*" [0-9]{3} [0-9-]+ "[^"]*" "[^"]*(?:Googlebot|Google-InspectionTool|Storebot-Google|bingbot|BingPreview|DuckDuckBot|Qwantify|Qwantbot|Applebot)[^"]*"
              ^<HOST> -[^"]*"[^"]*" [0-9]{3} [0-9-]+ "[^"]*" "[^"]*(?:Mastodon|Pleroma|Akkoma|Misskey|Firefish|Iceshrimp|Friendica|Lemmy|Mbin|PeerTube|Synapse|Matrix-Media-Repo|Discordbot|Slackbot|TelegramBot|Signal|WhatsApp|facebookexternalhit|Twitterbot|Nextcloud-News|Tiny Tiny RSS|FreshRSS|Feedbin|NetNewsWire|Miniflux|Liferea|Akregator|http\.rb)[^"]*"

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
