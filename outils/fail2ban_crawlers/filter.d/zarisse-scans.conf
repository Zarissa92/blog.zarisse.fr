# zarisse-scans : bannit les IP qui cherchent des failles qui n'existent pas ici.
#
# Le site est 100 % statique : aucun .php, aucun WordPress, aucun panneau
# d'administration. Toute requête vers ces chemins est donc forcément hostile,
# d'où maxretry = 1 dans la jail.
#
# Journal attendu : format COMBINED de nginx
#   $remote_addr - $remote_user [$time_local] "$request" $status $bytes "$referer" "$ua"

[INCLUDES]
before = common.conf

[Definition]

# Chemins caractéristiques des scans automatisés, suivis d'un code 4xx/5xx.
failregex = ^<HOST> -[^"]*"(?:GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS|PROPFIND|CONNECT) [^"]*(?:wp-login|wp-admin|wp-content|wp-includes|xmlrpc\.php|/\.env|/\.git|/\.svn|/\.aws|/\.ssh|/\.docker|/\.vscode|phpmyadmin|phpMyAdmin|/pma/|/dbadmin|/vendor/phpunit|eval-stdin\.php|/cgi-bin/|/boaform|/solr/|/actuator|/jenkins|/manager/html|/\.well-known/[^" ]*\.php|/autodiscover|/owa/|/ecp/|/hudson|/struts|/jmx-console|/console/login)[^"]*" (?:4[0-9][0-9]|5[0-9][0-9])
            ^<HOST> -[^"]*"(?:GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS|PROPFIND|CONNECT) [^"]*\.(?:php|phtml|php5|php7|asp|aspx|jsp|jspx|cgi|pl|sql|bak|old|swp|ini|conf|yml|yaml)(?:[?/][^"]*)? HTTP/[0-9.]+" (?:4[0-9][0-9]|5[0-9][0-9])

# Le flux RSS et ses à-côtés ne déclenchent jamais de ban.
ignoreregex = ^<HOST> -[^"]*"(?:GET|HEAD) /(?:feed_[^" ]*|rss\.xsl|robots\.txt|sitemap[^" ]*)

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
