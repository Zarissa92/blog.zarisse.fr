# Extrait nginx pour le formulaire de contact de kioske.fr.
# À placer dans le bloc « server { }  » de kioske.fr, via un fichier dans /etc/nginx/snippets/
# puis « include snippets/contact.conf; » à l'intérieur de ce bloc. Voir README.md.

location = /contact {
    # Seuls GET (affichage du formulaire) et POST (envoi) sont acceptés.
    limit_except GET POST {
        deny all;
    }

    # Le script refuse déjà plus de 8 Ko ; nginx coupe avant.
    client_max_body_size 8k;

    # Écrase l'en-tête envoyé par le visiteur : c'est l'adresse réelle que contact.py utilise.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 10s;

    proxy_pass http://127.0.0.1:8765;
}
