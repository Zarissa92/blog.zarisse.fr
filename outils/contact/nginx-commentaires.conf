# Extrait nginx pour les commentaires de blog.zarisse.fr.
# Deux choses à ajouter dans le bloc « server { }  » de blog.zarisse.fr :
#   1. « ssi on; »  (nginx traite alors l'include des commentaires dans les articles)
#   2. « include snippets/commentaires.conf; »  (ce fichier, copié dans /etc/nginx/snippets/)
# Voir README.md, section « Commentaires sous les articles ».

location = /commentaire {
    # GET : fragment des commentaires (inclus par SSI). POST : envoi d'un commentaire.
    limit_except GET POST {
        deny all;
    }

    client_max_body_size 8k;

    # Écrase l'en-tête envoyé par le visiteur : c'est l'adresse réelle que contact.py utilise.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 10s;

    proxy_pass http://127.0.0.1:8765;
}
