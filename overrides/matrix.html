<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - {{ config.site_name }}</title>
  <style>
    :root {
      --vert: #00ff41;
      --texte: #d8ffe0;
      --fond-cadre: rgba(2, 10, 4, 0.9);
    }
    @media (prefers-color-scheme: light) {
      /* Le thème reste sombre : on garde les mêmes couleurs */
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--texte);
      font-family: "Fira Code", "Consolas", "Courier New", monospace;
    }
    #pluie {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .cadre {
      width: 100%;
      max-width: 680px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      box-sizing: border-box;
      padding: 28px 32px;
      background: var(--fond-cadre);
      border: 1px solid var(--vert);
      border-radius: 6px;
      box-shadow: 0 0 24px rgba(0, 255, 65, 0.25), inset 0 0 18px rgba(0, 255, 65, 0.08);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      line-height: 1.6;
      font-size: 17px;
    }
    .cadre h1 {
      margin-top: 0;
      font-size: 1.8em;
      color: var(--vert);
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
    }
    .cadre h2 {
      color: var(--vert);
      font-size: 1.2em;
      margin-top: 1.6em;
      border-bottom: 1px dashed rgba(0, 255, 65, 0.4);
      padding-bottom: 4px;
    }
    .cadre a {
      color: #7dff9c;
      text-decoration: none;
      border-bottom: 1px solid rgba(125, 255, 156, 0.4);
    }
    .cadre a:hover,
    .cadre a:focus {
      color: #fff;
      border-bottom-color: #fff;
    }
    .cadre ul { padding-left: 1.2em; }
    .cadre li { margin: 0.4em 0; }
    .cadre code {
      background: rgba(0, 255, 65, 0.1);
      padding: 1px 5px;
      border-radius: 3px;
    }
    .cadre p { margin: 0.8em 0; }
    @media (max-width: 600px) {
      .cadre { padding: 20px 18px; font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #pluie { opacity: 0.35; }
    }
  </style>
</head>
<body>
  <canvas id="pluie" aria-hidden="true"></canvas>

  <main>
    <article class="cadre">
      {{ page.content }}
    </article>
  </main>

  <script>
    (function () {
      var canvas = document.getElementById("pluie");
      var ctx = canvas.getContext("2d");

      var caracteres = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF<>/{}[]";
      var taille = 18;
      var colonnes = 0;
      var gouttes = [];
      var vitesseMax = reduireMouvement() ? 0.3 : 1;

      function reduireMouvement() {
        return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }

      function initialiser() {
        var ratio = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * ratio;
        canvas.height = window.innerHeight * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        colonnes = Math.floor(window.innerWidth / taille);
        gouttes = [];
        for (var i = 0; i < colonnes; i++) {
          gouttes.push(Math.random() * -50);
        }
      }

      function caractereAleatoire() {
        return caracteres.charAt(Math.floor(Math.random() * caracteres.length));
      }

      function dessiner() {
        // Trainée semi-transparente : donne l'effet de fondu
        ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        ctx.font = taille + "px monospace";
        for (var i = 0; i < gouttes.length; i++) {
          var x = i * taille;
          var y = gouttes[i] * taille;

          // Tête de la goutte : plus claire
          ctx.fillStyle = "#d8ffe0";
          ctx.fillText(caractereAleatoire(), x, y);

          // Reste de la colonne : vert
          ctx.fillStyle = "#00ff41";
          ctx.globalAlpha = 0.6;
          ctx.fillText(caractereAleatoire(), x, y - taille);
          ctx.globalAlpha = 1;

          if (y > window.innerHeight && Math.random() > 0.975) {
            gouttes[i] = 0;
          } else {
            gouttes[i] += (0.5 + Math.random() * 0.5) * vitesseMax;
          }
        }
      }

      initialiser();
      window.addEventListener("resize", initialiser);
      // ~30 images par seconde : fluide sans chauffer le PC
      setInterval(dessiner, 33);
    })();
  </script>
</body>
</html>
